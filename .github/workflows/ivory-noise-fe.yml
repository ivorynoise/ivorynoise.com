name: Ivory Noise FE [Build and Push]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 0.0.1-dev)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Login to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: central-harbor.ext.synthlane.com
          username: ${{ secrets.INFISICAL_HARBOR_USERNAME }}
          password: ${{ secrets.INFISICAL_HARBOR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t central-harbor.ext.synthlane.com/ivory-noise-fe:${{ inputs.version }} .
          docker push central-harbor.ext.synthlane.com/ivory-noise-fe:${{ inputs.version }}
