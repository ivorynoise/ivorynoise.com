pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      stage_fixed: true
      run: npx biome format --write {staged_files}

    type-check:
      run: npx astro check

    secrets-scan:
      glob: "*.{ts,tsx,js,jsx,json,env,yaml,yml}"
      run: npx secretlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
